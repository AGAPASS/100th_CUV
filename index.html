<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#171008">
    <meta name="description" content="沿历史长卷，探索基督教传入中国与中文圣经翻译的千年轨迹。">
    <title>千年薪火 · 百年和合</title>
    <style>
        :root {
            color-scheme: dark;
            --ink: #26170d;
            --paper: #ead5aa;
            --paper-light: #f7edda;
            --cinnabar: #8d2f20;
            --gold: #d8a143;
            --gold-bright: #f2c66a;
            --black: #100b07;
            --source-width: 17060;
            --source-height: 806;
            --explore-bg: url("images/layer2/background_layer2.jpg");
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--black);
            font-family: "STKaiti", "KaiTi", "FangSong", "Noto Serif SC", serif;
        }

        button,
        input {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .app {
            position: relative;
            width: 100%;
            height: 100%;
            isolation: isolate;
            background:
                radial-gradient(circle at 50% 48%, rgba(113, 68, 31, 0.2), transparent 38%),
                #0e0906;
        }

        .stage {
            position: absolute;
            inset: 0;
            overflow: hidden;
            background: #0d0906;
            cursor: grab;
            touch-action: none;
            user-select: none;
        }

        .stage.is-dragging {
            cursor: grabbing;
        }

        .scroll-mask {
            position: absolute;
            inset: 0;
            overflow: hidden;
            clip-path: inset(0 50% 0 50%);
            filter: saturate(0.9) brightness(0.82);
            transition:
                clip-path 2.2s cubic-bezier(0.65, 0, 0.18, 1),
                filter 1.4s ease 0.7s;
        }

        body.is-started .scroll-mask {
            clip-path: inset(0 0 0 0);
            filter: saturate(1) brightness(1);
        }

        .timeline {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background-image: var(--explore-bg);
            background-size: 100% 100%;
            background-position: left center;
            background-repeat: no-repeat;
            will-change: transform;
            transition: opacity 0.45s ease, filter 0.45s ease;
        }

        .timeline::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(90deg, rgba(35, 19, 8, 0.2), transparent 2.5%, transparent 97.5%, rgba(35, 19, 8, 0.24)),
                linear-gradient(180deg, rgba(42, 22, 8, 0.12), transparent 14%, transparent 86%, rgba(42, 22, 8, 0.14));
            mix-blend-mode: multiply;
        }

        .reveal-edge {
            position: fixed;
            z-index: 28;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 12px;
            opacity: 0;
            pointer-events: none;
            border: 1px solid rgba(249, 214, 141, 0.48);
            background: linear-gradient(90deg, #4e2b13, #c59346 42%, #6a3a18 74%, #2d180c);
            box-shadow: 0 0 22px rgba(0, 0, 0, 0.75), 0 0 5px rgba(240, 191, 95, 0.42);
        }

        body.is-started .reveal-edge.left {
            animation: unfurl-left 2.2s cubic-bezier(0.65, 0, 0.18, 1) both;
        }

        body.is-started .reveal-edge.right {
            animation: unfurl-right 2.2s cubic-bezier(0.65, 0, 0.18, 1) both;
        }

        @keyframes unfurl-left {
            0% { left: calc(50% - 6px); opacity: 1; }
            84% { opacity: 1; }
            100% { left: -14px; opacity: 0; }
        }

        @keyframes unfurl-right {
            0% { left: calc(50% - 6px); opacity: 1; }
            84% { opacity: 1; }
            100% { left: calc(100% + 2px); opacity: 0; }
        }

        .cinematic-bars {
            display: none;
        }

        .cinematic-bars::before,
        .cinematic-bars::after {
            content: "";
            position: absolute;
            left: 0;
            width: 100%;
            height: max(4.5vh, env(safe-area-inset-top));
            background: linear-gradient(#080503, #0c0805);
            box-shadow: 0 2px 18px rgba(0, 0, 0, 0.42);
        }

        .cinematic-bars::before {
            top: 0;
        }

        .cinematic-bars::after {
            bottom: 0;
            transform: rotate(180deg);
        }

        .hotspot-layer {
            position: absolute;
            inset: 0;
            z-index: 4;
            opacity: 0;
            transition: opacity 0.8s ease 1.6s;
        }

        body.is-started .hotspot-layer {
            opacity: 1;
        }

        .hotspot {
            --marker-size: clamp(32px, 3.1vw, 48px);
            position: absolute;
            left: var(--x);
            top: var(--y);
            width: var(--marker-size);
            height: var(--marker-size);
            transform: translate(-50%, -50%);
            display: grid;
            place-items: center;
            padding: 0;
            color: #fff7e7;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(13px, 1.1vw, 18px);
            line-height: 1;
            border: 1px solid rgba(255, 238, 191, 0.9);
            border-radius: 50%;
            background:
                radial-gradient(circle at 35% 30%, rgba(255, 223, 137, 0.95), rgba(179, 93, 31, 0.94) 46%, rgba(85, 35, 15, 0.98) 100%);
            box-shadow:
                0 2px 8px rgba(37, 16, 5, 0.65),
                0 0 0 5px rgba(215, 156, 61, 0.18),
                0 0 20px rgba(241, 185, 74, 0.36);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        .hotspot::before {
            content: "";
            position: absolute;
            inset: -10px;
            border: 1px solid rgba(235, 181, 79, 0.45);
            border-radius: 50%;
            animation: marker-pulse 2.6s ease-out infinite;
        }

        .hotspot::after {
            content: attr(data-title);
            position: absolute;
            left: 50%;
            bottom: calc(100% + 12px);
            transform: translate(-50%, 4px);
            width: max-content;
            max-width: 220px;
            padding: 7px 11px;
            color: #fff7e8;
            font-family: "STKaiti", "KaiTi", serif;
            font-size: 15px;
            line-height: 1.2;
            letter-spacing: 0.04em;
            text-align: center;
            white-space: nowrap;
            border: 1px solid rgba(230, 180, 92, 0.55);
            border-radius: 999px;
            background: rgba(31, 17, 9, 0.9);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.36);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .hotspot:hover,
        .hotspot:focus-visible {
            z-index: 6;
            transform: translate(-50%, -50%) scale(1.12);
            filter: brightness(1.12);
            box-shadow:
                0 4px 12px rgba(37, 16, 5, 0.72),
                0 0 0 6px rgba(239, 185, 76, 0.26),
                0 0 28px rgba(255, 202, 93, 0.58);
            outline: none;
        }

        .hotspot:hover::after,
        .hotspot:focus-visible::after {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        @keyframes marker-pulse {
            0%, 30% { opacity: 0.7; transform: scale(0.82); }
            72%, 100% { opacity: 0; transform: scale(1.5); }
        }

        .hud {
            position: fixed;
            z-index: 24;
            inset: 0;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.55s ease 1.65s;
        }

        body.is-started .hud {
            opacity: 1;
        }

        .site-mark,
        .top-actions,
        .timeline-controls,
        .chapter-status {
            pointer-events: auto;
        }

        .site-mark {
            position: absolute;
            top: max(16px, calc(env(safe-area-inset-top) + 9px));
            left: max(18px, calc(env(safe-area-inset-left) + 18px));
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 246, 223, 0.92);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.72);
            letter-spacing: 0.15em;
        }

        .site-mark .seal {
            display: grid;
            place-items: center;
            width: 31px;
            height: 31px;
            color: #f5dfac;
            font-size: 18px;
            letter-spacing: 0;
            border: 1px solid rgba(245, 223, 172, 0.74);
            background: rgba(112, 35, 24, 0.86);
        }

        .site-mark strong {
            font-size: clamp(14px, 1.25vw, 19px);
            font-weight: 500;
        }

        .top-actions {
            position: absolute;
            top: max(15px, calc(env(safe-area-inset-top) + 8px));
            right: max(18px, calc(env(safe-area-inset-right) + 18px));
            display: flex;
            gap: 8px;
        }

        .hud-button {
            min-height: 38px;
            padding: 0 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            color: #fff4d8;
            font-size: 14px;
            letter-spacing: 0.05em;
            border: 1px solid rgba(225, 178, 91, 0.48);
            border-radius: 999px;
            background: rgba(27, 15, 8, 0.78);
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.22);
            backdrop-filter: blur(8px);
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }

        .hud-button:hover,
        .hud-button:focus-visible {
            background: rgba(91, 43, 18, 0.88);
            border-color: rgba(244, 201, 113, 0.82);
            outline: none;
            transform: translateY(-1px);
        }

        .hud-button:disabled {
            opacity: 0.62;
            cursor: wait;
            transform: none;
        }

        .hud-button .icon {
            min-width: 1.15em;
            font-family: Arial, sans-serif;
            font-size: 15px;
            text-align: center;
        }

        .chapter-status {
            position: absolute;
            left: 50%;
            bottom: max(88px, calc(env(safe-area-inset-bottom) + 78px));
            transform: translateX(-50%);
            width: min(78vw, 630px);
            text-align: center;
            color: #fff2d2;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
        }

        .chapter-status .eyebrow {
            display: block;
            margin-bottom: 4px;
            color: rgba(248, 208, 127, 0.88);
            font-family: Arial, sans-serif;
            font-size: 11px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
        }

        .chapter-status strong {
            display: block;
            overflow: hidden;
            font-size: clamp(16px, 1.6vw, 23px);
            font-weight: 500;
            letter-spacing: 0.08em;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .timeline-controls {
            position: absolute;
            left: 50%;
            bottom: max(20px, calc(env(safe-area-inset-bottom) + 12px));
            transform: translateX(-50%);
            width: min(86vw, 780px);
            padding: 10px 13px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(220, 168, 78, 0.38);
            border-radius: 18px;
            background: rgba(22, 12, 7, 0.76);
            box-shadow: 0 10px 38px rgba(0, 0, 0, 0.38);
            backdrop-filter: blur(10px);
        }

        .control-cluster {
            display: flex;
            gap: 7px;
        }

        .round-button {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            padding: 0;
            color: #fff2d3;
            font-family: Arial, sans-serif;
            font-size: 15px;
            border: 1px solid rgba(220, 168, 78, 0.42);
            border-radius: 50%;
            background: rgba(102, 51, 20, 0.46);
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .round-button:hover,
        .round-button:focus-visible {
            background: rgba(157, 84, 31, 0.72);
            outline: none;
            transform: scale(1.05);
        }

        .progress-wrap {
            position: relative;
            height: 30px;
            display: flex;
            align-items: center;
        }

        .progress-wrap::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 2px;
            transform: translateY(-50%);
            background: linear-gradient(90deg, rgba(216, 161, 67, 0.92) var(--progress, 0%), rgba(255, 244, 217, 0.28) var(--progress, 0%));
        }

        .timeline-range {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 30px;
            margin: 0;
            appearance: none;
            background: transparent;
            cursor: ew-resize;
        }

        .timeline-range::-webkit-slider-runnable-track {
            height: 2px;
            background: transparent;
        }

        .timeline-range::-webkit-slider-thumb {
            width: 16px;
            height: 16px;
            margin-top: -7px;
            appearance: none;
            border: 2px solid #fff1ce;
            border-radius: 50%;
            background: var(--cinnabar);
            box-shadow: 0 0 0 4px rgba(216, 161, 67, 0.2);
        }

        .timeline-range::-moz-range-track {
            height: 2px;
            background: transparent;
        }

        .timeline-range::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border: 2px solid #fff1ce;
            border-radius: 50%;
            background: var(--cinnabar);
            box-shadow: 0 0 0 4px rgba(216, 161, 67, 0.2);
        }

        .position-readout {
            min-width: 52px;
            color: rgba(255, 236, 197, 0.78);
            font-family: Georgia, serif;
            font-size: 12px;
            text-align: right;
        }

        .opening {
            position: fixed;
            inset: 0;
            z-index: 60;
            display: grid;
            place-items: center;
            padding: 28px;
            color: #f7e8c8;
            text-align: center;
            background:
                radial-gradient(circle at 50% 44%, rgba(109, 66, 32, 0.26), transparent 33%),
                linear-gradient(135deg, rgba(54, 30, 14, 0.28), transparent 45%),
                #100a06;
            transition: opacity 0.7s ease, visibility 0.7s ease;
        }

        .opening::before {
            content: "";
            position: absolute;
            inset: 18px;
            border: 1px solid rgba(201, 150, 67, 0.2);
            pointer-events: none;
        }

        .opening.is-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .opening-content {
            position: relative;
            width: min(680px, 90vw);
        }

        .opening-seal {
            width: 56px;
            height: 56px;
            margin: 0 auto 24px;
            display: grid;
            place-items: center;
            color: #f4dfb3;
            font-size: 31px;
            border: 1px solid rgba(244, 223, 179, 0.74);
            background: rgba(137, 45, 30, 0.76);
            box-shadow: 0 0 34px rgba(180, 95, 39, 0.22);
        }

        .opening-kicker {
            margin: 0 0 13px;
            color: rgba(222, 176, 96, 0.92);
            font-family: Georgia, serif;
            font-size: 12px;
            letter-spacing: 0.32em;
        }

        .opening h1 {
            margin: 0;
            font-size: clamp(38px, 7vw, 74px);
            font-weight: 400;
            line-height: 1.08;
            letter-spacing: 0.16em;
            text-shadow: 0 7px 30px rgba(0, 0, 0, 0.5);
        }

        .opening .subtitle {
            margin: 20px auto 30px;
            color: rgba(242, 220, 180, 0.76);
            font-size: clamp(15px, 1.7vw, 19px);
            line-height: 1.8;
            letter-spacing: 0.08em;
        }

        .open-scroll {
            min-width: 176px;
            min-height: 50px;
            padding: 0 26px;
            color: #fff4d8;
            font-size: 17px;
            letter-spacing: 0.12em;
            border: 1px solid rgba(238, 196, 114, 0.72);
            border-radius: 2px;
            background: linear-gradient(180deg, rgba(143, 68, 26, 0.84), rgba(96, 39, 19, 0.92));
            box-shadow: 0 11px 32px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(255, 235, 190, 0.12);
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease, opacity 0.2s ease;
        }

        .open-scroll:hover:not(:disabled),
        .open-scroll:focus-visible:not(:disabled) {
            filter: brightness(1.12);
            outline: 2px solid rgba(243, 202, 122, 0.4);
            outline-offset: 4px;
            transform: translateY(-2px);
        }

        .open-scroll:disabled {
            opacity: 0.56;
            cursor: wait;
        }

        .opening-hint {
            margin: 16px 0 0;
            color: rgba(242, 220, 180, 0.54);
            font-family: system-ui, sans-serif;
            font-size: 12px;
            letter-spacing: 0.04em;
        }

        .rotate-tip {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 80;
            place-items: center;
            padding: 32px;
            color: #f7e6c2;
            text-align: center;
            background: rgba(14, 9, 6, 0.96);
        }

        .rotate-tip strong {
            display: block;
            margin-bottom: 10px;
            font-size: 26px;
            font-weight: 400;
            letter-spacing: 0.12em;
        }

        .rotate-tip span {
            color: rgba(247, 230, 194, 0.68);
            font-family: system-ui, sans-serif;
            font-size: 14px;
        }

        .toast {
            position: fixed;
            z-index: 46;
            left: 50%;
            top: 14%;
            transform: translate(-50%, -10px);
            max-width: min(86vw, 520px);
            padding: 10px 16px;
            color: #fff0cf;
            font-size: 14px;
            letter-spacing: 0.05em;
            text-align: center;
            border: 1px solid rgba(226, 175, 87, 0.5);
            border-radius: 999px;
            background: rgba(35, 18, 9, 0.9);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.32);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .toast.is-visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .detail-dialog {
            width: auto;
            max-width: none;
            max-height: none;
            margin: auto;
            padding: 0;
            overflow: visible;
            color: var(--ink);
            border: 0;
            border-radius: clamp(8px, 1.6vw, 24px);
            background: transparent;
            box-shadow: 0 28px 90px rgba(0, 0, 0, 0.62);
        }

        .detail-dialog::backdrop {
            background: rgba(12, 8, 5, 0.78);
            backdrop-filter: blur(7px) saturate(0.7);
        }

        .detail-shell {
            position: relative;
            width: min(92vw, calc(84vh * 1.5472), 1320px);
            aspect-ratio: 1934 / 1250;
            overflow: hidden;
            border-radius: clamp(8px, 1.6vw, 24px);
            background: #ead7b4;
        }

        .detail-shell::before {
            content: "正在打开历史详情…";
            position: absolute;
            z-index: 5;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            padding: 11px 18px;
            color: #6e381d;
            font-size: clamp(14px, 1.5vw, 18px);
            letter-spacing: 0.08em;
            white-space: nowrap;
            border: 1px solid rgba(134, 75, 33, 0.25);
            border-radius: 999px;
            background: rgba(248, 233, 204, 0.9);
            box-shadow: 0 8px 28px rgba(66, 35, 16, 0.16);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s ease;
        }

        .detail-shell.is-loading::before {
            opacity: 1;
        }

        .detail-image,
        .detail-background {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: opacity 0.2s ease;
        }

        .detail-composite {
            position: absolute;
            inset: 0;
            display: none;
            transition: opacity 0.2s ease;
        }

        .detail-shell.is-loading .detail-image,
        .detail-shell.is-loading .detail-composite {
            opacity: 0;
        }

        .detail-shell.is-composite .detail-image {
            display: none;
        }

        .detail-shell.is-composite .detail-composite {
            display: block;
        }

        .detail-text-scroll {
            position: absolute;
            z-index: 2;
            inset: 8.4% 0 2.2%;
            overflow-x: hidden;
            overflow-y: auto;
            overscroll-behavior: contain;
            scrollbar-color: rgba(140, 78, 31, 0.68) rgba(232, 207, 164, 0.38);
            scrollbar-width: thin;
        }

        .detail-text-scroll img {
            display: block;
            width: 100%;
            height: auto;
            pointer-events: none;
        }

        .detail-close {
            position: absolute;
            z-index: 6;
            top: 0.4%;
            right: 0.2%;
            width: clamp(50px, 6.4vw, 86px);
            height: clamp(42px, 6.2vw, 78px);
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
            cursor: pointer;
        }

        .detail-shell.is-loading .detail-close {
            display: grid;
            place-items: center;
            color: #fff6e7;
            font-family: Arial, sans-serif;
            font-size: clamp(28px, 4vw, 46px);
            background: rgba(102, 51, 25, 0.74);
        }

        .detail-shell.is-loading .detail-close::before {
            content: "×";
        }

        .detail-close:focus-visible {
            outline: 3px solid rgba(255, 248, 225, 0.95);
            outline-offset: -7px;
        }

        @media (max-width: 760px) {
            .site-mark strong,
            .hud-button .label,
            .position-readout {
                display: none;
            }

            .hud-button {
                width: 40px;
                padding: 0;
            }

            .timeline-controls {
                width: min(94vw, 760px);
                grid-template-columns: auto 1fr;
            }

            .position-readout {
                min-width: 0;
            }

            .chapter-status {
                bottom: max(78px, calc(env(safe-area-inset-bottom) + 68px));
            }

            .hotspot::after {
                display: none;
            }
        }

        @media (orientation: portrait) and (max-width: 900px) {
            .rotate-tip {
                display: grid;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="app" aria-label="基督教传入中国历史时间轴">
        <section id="stage" class="stage" aria-label="横向历史长卷；可左右拖动、滚轮或方向键浏览">
            <div id="scroll-mask" class="scroll-mask">
                <div id="timeline" class="timeline">
                    <div id="hotspot-layer" class="hotspot-layer" aria-label="历史事件热点"></div>
                </div>
            </div>
        </section>

        <div class="reveal-edge left" aria-hidden="true"></div>
        <div class="reveal-edge right" aria-hidden="true"></div>

        <div class="hud">
            <div class="site-mark" aria-hidden="true">
                <span class="seal">和</span>
                <strong>千年薪火 · 百年和合</strong>
            </div>

            <div class="top-actions">
                <button id="music-button" class="hud-button" type="button" aria-label="暂停背景音乐" aria-pressed="true">
                    <span id="music-icon" class="icon" aria-hidden="true">♫</span>
                    <span id="music-label" class="label">音乐开启</span>
                </button>
            </div>

            <div class="chapter-status" aria-live="polite">
                <span id="mode-eyebrow" class="eyebrow">FREE EXPLORE</span>
                <strong id="chapter-label">1 · 丝绸之路</strong>
            </div>

            <div class="timeline-controls" aria-label="时间轴浏览控制">
                <div class="control-cluster">
                    <button id="restart-button" class="round-button" type="button" aria-label="回到时间轴起点">↶</button>
                </div>
                <div id="progress-wrap" class="progress-wrap">
                    <label class="sr-only" for="timeline-range">时间轴位置</label>
                    <input id="timeline-range" class="timeline-range" type="range" min="0" max="1000" value="0" step="1">
                </div>
                <output id="position-readout" class="position-readout" for="timeline-range">0%</output>
            </div>
        </div>

        <section id="opening" class="opening" aria-labelledby="opening-title">
            <div class="opening-content">
                <div class="opening-seal" aria-hidden="true">和</div>
                <p class="opening-kicker">A JOURNEY THROUGH HISTORY</p>
                <h1 id="opening-title">千年薪火<br>百年和合</h1>
                <p class="subtitle">沿一轴古卷，回望基督教传入中国<br>与中文圣经翻译的千年足迹</p>
                <button id="open-scroll" class="open-scroll" type="button" disabled>画卷加载中…</button>
                <p class="opening-hint">启卷后自由探索 · 左右拖动并点击光点查看详情</p>
            </div>
        </section>

        <div class="rotate-tip" role="status">
            <div>
                <strong>请横屏启卷</strong>
                <span>横向观看可获得完整的时间轴体验</span>
            </div>
        </div>

        <div id="toast" class="toast" role="status" aria-live="polite"></div>

        <dialog id="detail-dialog" class="detail-dialog" aria-labelledby="detail-heading">
            <h2 id="detail-heading" class="sr-only">历史事件详情</h2>
            <div id="detail-shell" class="detail-shell">
                <img id="detail-image" class="detail-image" src="" alt="">
                <div class="detail-composite">
                    <img id="detail-background" class="detail-background" src="" alt="">
                    <div id="detail-text-scroll" class="detail-text-scroll" tabindex="0" aria-label="上下滚动阅读完整介绍">
                        <img id="detail-text" src="" alt="">
                    </div>
                </div>
                <button id="detail-close" class="detail-close" type="button" aria-label="关闭详情">
                    <span class="sr-only">关闭</span>
                </button>
            </div>
        </dialog>

        <audio id="bgm" loop preload="metadata">
            <source src="audio/bgm.mp3" type="audio/mpeg">
        </audio>
    </main>

    <script>
        (() => {
            "use strict";

            const SOURCE_WIDTH = 17060;
            const SOURCE_HEIGHT = 806;
            const EXPLORE_BACKGROUND = "images/layer2/background_layer2.jpg";

            // Reference board: 12408×606. The timeline is 17060×806; its matching
            // background begins 18.62 source pixels before the reference crop.
            const events = [
                { id: 1, title: "丝绸之路", x: 3.62, y: 45.05, image: "images/layer3/optimized/01.webp" },
                { id: 2, title: "最古铁十字架", x: 11.70, y: 29.37, image: "images/layer3/optimized/02.webp" },
                { id: 3, title: "景教入华", x: 17.49, y: 58.25, image: "images/layer3/optimized/03.webp" },
                { id: 4, title: "大秦景教流行中国碑", x: 24.38, y: 31.52, image: "images/layer3/optimized/04.webp" },
                { id: 5, title: "聂斯多略派教徒墓碑", x: 30.20, y: 68.48, image: "images/layer3/optimized/05.webp" },
                { id: 6, title: "也里可温教", x: 35.24, y: 48.35, image: "images/layer3/optimized/06.webp" },
                { id: 7, title: "孟高维诺译本", x: 39.52, y: 69.64, image: "images/layer3/optimized/07.webp" },
                { id: 8, title: "祖传天主十诫", x: 48.75, y: 58.25, image: "images/layer3/optimized/08.webp" },
                { id: 9, title: "闭关锁国", x: 43.01, y: 10.23, image: "images/layer3/optimized/09.webp" },
                { id: 10, title: "西学东渐", x: 49.07, y: 46.70, image: "images/layer3/optimized/10.webp" },
                { id: 11, title: "徐光启与《几何原本》", x: 49.82, y: 56.77, image: "images/layer3/optimized/11.webp" },
                { id: 12, title: "康熙与《十架颂》", x: 54.62, y: 62.05, background: "images/layer3/optimized/12-background.webp", text: "images/layer3/optimized/12-text.webp" },
                { id: 13, title: "礼仪之争", x: 61.07, y: 30.53, image: "images/layer3/optimized/13.webp" },
                { id: 14, title: "百年禁教", x: 64.53, y: 88.61, image: "images/layer3/optimized/14.webp" },
                { id: 15, title: "马礼逊：新教第一人", x: 69.51, y: 38.12, image: "images/layer3/optimized/15.webp" },
                { id: 16, title: "《神天圣书》", x: 68.60, y: 79.21, image: "images/layer3/optimized/16.webp" },
                { id: 17, title: "中国第一位新教徒", x: 71.98, y: 57.10, image: "images/layer3/optimized/17.webp" },
                { id: 18, title: "大规模中文译经", x: 75.04, y: 29.04, background: "images/layer3/optimized/18-background.webp", text: "images/layer3/optimized/18-text.webp" },
                { id: 19, title: "太平天国运动", x: 78.86, y: 25.41, image: "images/layer3/optimized/19.webp" },
                { id: 20, title: "《新旧遗诏圣书》", x: 80.65, y: 35.97, image: "images/layer3/optimized/20.webp" },
                { id: 21, title: "义和团运动", x: 85.63, y: 18.15, image: "images/layer3/optimized/21.webp" },
                { id: 22, title: "辛亥革命", x: 89.43, y: 16.83, image: "images/layer3/optimized/22.webp" },
                { id: 23, title: "五四运动", x: 92.07, y: 27.72, image: "images/layer3/optimized/23.webp" },
                { id: 24, title: "官话和合本", x: 89.26, y: 67.00, image: "images/layer3/optimized/24.webp" }
            ];

            const stage = document.getElementById("stage");
            const timeline = document.getElementById("timeline");
            const hotspotLayer = document.getElementById("hotspot-layer");
            const opening = document.getElementById("opening");
            const openScrollButton = document.getElementById("open-scroll");
            const restartButton = document.getElementById("restart-button");
            const musicButton = document.getElementById("music-button");
            const musicIcon = document.getElementById("music-icon");
            const musicLabel = document.getElementById("music-label");
            const timelineRange = document.getElementById("timeline-range");
            const progressWrap = document.getElementById("progress-wrap");
            const positionReadout = document.getElementById("position-readout");
            const modeEyebrow = document.getElementById("mode-eyebrow");
            const chapterLabel = document.getElementById("chapter-label");
            const toast = document.getElementById("toast");
            const audio = document.getElementById("bgm");
            const detailDialog = document.getElementById("detail-dialog");
            const detailHeading = document.getElementById("detail-heading");
            const detailShell = document.getElementById("detail-shell");
            const detailImage = document.getElementById("detail-image");
            const detailBackground = document.getElementById("detail-background");
            const detailText = document.getElementById("detail-text");
            const detailTextScroll = document.getElementById("detail-text-scroll");
            const detailClose = document.getElementById("detail-close");

            let scale = 1;
            let worldWidth = SOURCE_WIDTH;
            let maxScroll = 0;
            let scrollPosition = 0;
            let started = false;
            let lastFocusedHotspot = null;
            let detailRequestId = 0;
            let toastTimer = 0;
            let pointerId = null;
            let pointerStartX = 0;
            let pointerStartScroll = 0;
            let pointerTravel = 0;

            function clamp(value, min, max) {
                return Math.min(Math.max(value, min), max);
            }

            function sourcePosition() {
                return scale ? scrollPosition / scale : 0;
            }

            function nearestEvent(position) {
                return events.reduce((nearest, event) => {
                    const eventPosition = event.x * SOURCE_WIDTH / 100;
                    const nearestPosition = nearest.x * SOURCE_WIDTH / 100;
                    return Math.abs(eventPosition - position) < Math.abs(nearestPosition - position) ? event : nearest;
                }, events[0]);
            }

            function resizeTimeline() {
                const oldSourcePosition = sourcePosition();
                scale = window.innerHeight / SOURCE_HEIGHT;
                worldWidth = SOURCE_WIDTH * scale;
                timeline.style.width = `${worldWidth}px`;
                timeline.style.height = `${window.innerHeight}px`;
                maxScroll = Math.max(0, worldWidth - window.innerWidth);
                scrollPosition = clamp(oldSourcePosition * scale, 0, maxScroll);
                renderPosition();
            }

            function renderPosition() {
                timeline.style.transform = `translate3d(${-scrollPosition}px, 0, 0)`;
                const maximum = Math.max(1, maxScroll);
                const ratio = clamp(scrollPosition / maximum, 0, 1);
                const percent = Math.round(ratio * 100);
                timelineRange.value = String(Math.round(ratio * 1000));
                progressWrap.style.setProperty("--progress", `${ratio * 100}%`);
                positionReadout.value = `${percent}%`;
                positionReadout.textContent = `${percent}%`;
                updateExploreStatus();
                if (started) preloadNearbyDetails();
            }

            function setScrollPosition(nextPosition) {
                scrollPosition = clamp(nextPosition, 0, maxScroll);
                renderPosition();
            }

            function seekToSource(nextSourcePosition) {
                setScrollPosition(nextSourcePosition * scale);
            }

            function preloadImage(source, priority = "auto") {
                return new Promise((resolve) => {
                    const image = new Image();
                    image.decoding = "async";
                    image.fetchPriority = priority;
                    image.onload = () => resolve({ source, loaded: true });
                    image.onerror = () => resolve({ source, loaded: false });
                    image.src = source;
                });
            }

            function preloadEventDetails(event, priority = "low") {
                if (!event.detailPromise) {
                    const sources = event.image ? [event.image] : [event.background, event.text];
                    event.detailPromise = Promise.all(sources.map((source) => preloadImage(source, priority)))
                        .then((results) => {
                            const loaded = results.every((result) => result.loaded);
                            if (!loaded) event.detailPromise = null;
                            return loaded;
                        });
                }
                return event.detailPromise;
            }

            function preloadNearbyDetails() {
                if (navigator.connection?.saveData) return;
                const viewportSourceWidth = window.innerWidth / Math.max(scale, 0.001);
                const left = sourcePosition() - 650;
                const right = sourcePosition() + viewportSourceWidth + 900;
                events.forEach((event) => {
                    const eventPosition = event.x * SOURCE_WIDTH / 100;
                    if (eventPosition >= left && eventPosition <= right) preloadEventDetails(event);
                });
            }

            function decodeImage(element) {
                return typeof element.decode === "function" ? element.decode().catch(() => undefined) : Promise.resolve();
            }

            function updateExploreStatus() {
                const position = sourcePosition();
                const event = nearestEvent(position + window.innerWidth / Math.max(scale, 0.001) / 2);
                modeEyebrow.textContent = "FREE EXPLORE";
                chapterLabel.textContent = `${event.id} · ${event.title}`;
            }

            function showToast(message) {
                window.clearTimeout(toastTimer);
                toast.textContent = message;
                toast.classList.add("is-visible");
                toastTimer = window.setTimeout(() => toast.classList.remove("is-visible"), 3800);
            }

            function updateMusicButton() {
                const isPlaying = !audio.paused;
                musicIcon.textContent = isPlaying ? "♫" : "♪";
                musicLabel.textContent = isPlaying ? "音乐开启" : "音乐暂停";
                musicButton.setAttribute("aria-label", isPlaying ? "暂停背景音乐" : "播放背景音乐");
                musicButton.setAttribute("aria-pressed", String(isPlaying));
            }

            async function startMusic() {
                audio.volume = 0.5;
                try {
                    await audio.play();
                } catch (error) {
                    showToast("浏览器暂未播放音乐，可点击右上角音乐按钮开启");
                }
                updateMusicButton();
            }

            async function toggleMusic() {
                if (audio.paused) {
                    await startMusic();
                } else {
                    audio.pause();
                    updateMusicButton();
                }
            }

            async function openDetail(event, hotspot) {
                if (pointerTravel > 8) return;
                const requestId = ++detailRequestId;
                lastFocusedHotspot = hotspot;
                detailHeading.textContent = event.title;
                detailShell.classList.toggle("is-composite", Boolean(event.background && event.text));
                detailShell.classList.add("is-loading");
                detailImage.removeAttribute("src");
                detailBackground.removeAttribute("src");
                detailText.removeAttribute("src");
                detailDialog.showModal();
                detailClose.focus({ preventScroll: true });

                const loaded = await preloadEventDetails(event, "high");
                if (requestId !== detailRequestId || !detailDialog.open) return;

                if (!loaded) {
                    closeDetail();
                    showToast("详情图片暂未加载成功，请稍后重试");
                    return;
                }

                if (event.background && event.text) {
                    detailBackground.src = event.background;
                    detailBackground.alt = `${event.title}详情背景`;
                    detailText.src = event.text;
                    detailText.alt = `${event.title}完整文字介绍`;
                    detailTextScroll.scrollTop = 0;
                    detailImage.removeAttribute("src");
                    detailImage.alt = "";
                    await Promise.all([decodeImage(detailBackground), decodeImage(detailText)]);
                } else {
                    detailImage.src = event.image;
                    detailImage.alt = `${event.title}历史介绍`;
                    detailBackground.removeAttribute("src");
                    detailText.removeAttribute("src");
                    await decodeImage(detailImage);
                }

                if (requestId === detailRequestId && detailDialog.open) {
                    requestAnimationFrame(() => detailShell.classList.remove("is-loading"));
                }
            }

            function closeDetail() {
                if (!detailDialog.open) return;
                detailRequestId += 1;
                detailShell.classList.remove("is-loading");
                detailDialog.close();
            }

            function buildHotspots() {
                const fragment = document.createDocumentFragment();
                events.forEach((event) => {
                    const button = document.createElement("button");
                    button.type = "button";
                    button.className = "hotspot";
                    button.textContent = event.id;
                    button.dataset.title = event.title;
                    button.style.setProperty("--x", `${event.x}%`);
                    button.style.setProperty("--y", `${event.y}%`);
                    button.setAttribute("aria-label", `${event.id}，${event.title}，打开详情`);
                    button.addEventListener("pointerenter", () => preloadEventDetails(event));
                    button.addEventListener("focus", () => preloadEventDetails(event));
                    button.addEventListener("click", () => openDetail(event, button));
                    fragment.appendChild(button);
                });
                hotspotLayer.appendChild(fragment);
            }

            function handlePointerDown(event) {
                if (!started || detailDialog.open || event.button !== 0 || event.target.closest("button, input")) return;
                pointerId = event.pointerId;
                pointerStartX = event.clientX;
                pointerStartScroll = scrollPosition;
                pointerTravel = 0;
                stage.classList.add("is-dragging");
                stage.setPointerCapture(pointerId);
            }

            function handlePointerMove(event) {
                if (event.pointerId !== pointerId) return;
                const delta = pointerStartX - event.clientX;
                pointerTravel = Math.max(pointerTravel, Math.abs(delta));
                setScrollPosition(pointerStartScroll + delta);
            }

            function handlePointerUp(event) {
                if (event.pointerId !== pointerId) return;
                if (stage.hasPointerCapture(pointerId)) stage.releasePointerCapture(pointerId);
                pointerId = null;
                stage.classList.remove("is-dragging");
                window.setTimeout(() => { pointerTravel = 0; }, 0);
            }

            function startExperience() {
                if (started) return;
                started = true;
                document.body.classList.add("is-started");
                opening.classList.add("is-hidden");
                startMusic();
                preloadNearbyDetails();

                window.setTimeout(() => {
                    updateExploreStatus();
                    showToast("自由探索：左右拖动、滚轮或方向键浏览，点击光点查看详情");
                }, 2250);
            }

            async function prepareExperience() {
                resizeTimeline();
                buildHotspots();

                const criticalLoad = Promise.all([
                    preloadImage(EXPLORE_BACKGROUND)
                ]);
                const safetyTimeout = new Promise((resolve) => window.setTimeout(resolve, 12000));
                await Promise.race([criticalLoad, safetyTimeout]);
                openScrollButton.disabled = false;
                openScrollButton.textContent = "启卷探索";
            }

            openScrollButton.addEventListener("click", startExperience);

            restartButton.addEventListener("click", () => {
                seekToSource(0);
                showToast("已回到时间轴起点");
            });

            musicButton.addEventListener("click", toggleMusic);
            audio.addEventListener("play", updateMusicButton);
            audio.addEventListener("pause", updateMusicButton);

            timelineRange.addEventListener("input", () => {
                const ratio = Number(timelineRange.value) / 1000;
                setScrollPosition(maxScroll * ratio);
            });

            stage.addEventListener("pointerdown", handlePointerDown);
            stage.addEventListener("pointermove", handlePointerMove);
            stage.addEventListener("pointerup", handlePointerUp);
            stage.addEventListener("pointercancel", handlePointerUp);

            stage.addEventListener("wheel", (event) => {
                if (!started || detailDialog.open) return;
                event.preventDefault();
                const delta = Math.abs(event.deltaX) > Math.abs(event.deltaY) ? event.deltaX : event.deltaY;
                setScrollPosition(scrollPosition + delta * 1.2);
            }, { passive: false });

            window.addEventListener("keydown", (event) => {
                if (!started || detailDialog.open || event.target.matches("input, button")) return;
                const step = event.shiftKey ? window.innerWidth * 0.75 : 120;
                if (["ArrowLeft", "ArrowRight", "PageUp", "PageDown", "Home", "End"].includes(event.key)) {
                    event.preventDefault();
                }

                if (event.key === "ArrowLeft" || event.key === "PageUp") {
                    setScrollPosition(scrollPosition - step);
                } else if (event.key === "ArrowRight" || event.key === "PageDown") {
                    setScrollPosition(scrollPosition + step);
                } else if (event.key === "Home") {
                    setScrollPosition(0);
                } else if (event.key === "End") {
                    setScrollPosition(maxScroll);
                }
            });

            detailClose.addEventListener("click", closeDetail);
            detailDialog.addEventListener("click", (event) => {
                if (event.target === detailDialog) closeDetail();
            });
            detailDialog.addEventListener("close", () => {
                if (lastFocusedHotspot) lastFocusedHotspot.focus({ preventScroll: true });
            });

            window.addEventListener("resize", resizeTimeline, { passive: true });
            window.addEventListener("orientationchange", resizeTimeline, { passive: true });

            prepareExperience();
        })();
    </script>
</body>
</html>
