<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#171008">
    <meta name="description" content="沿历史长卷，探索基督教传入中国与中文圣经翻译的千年轨迹。">
    <title>千年薪火 · 百年和合</title>
    <style>
        :root {
            color-scheme: dark;
            --ink: #26170d;
            --paper: #ead5aa;
            --paper-light: #f7edda;
            --cinnabar: #8d2f20;
            --gold: #d8a143;
            --gold-bright: #f2c66a;
            --black: #100b07;
            --source-width: 17060;
            --source-height: 806;
            --narrative-bg: url("images/layer1/background_layer1.jpg");
            --explore-bg: url("images/layer2/background_layer2.jpg");
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--black);
            font-family: "STKaiti", "KaiTi", "FangSong", "Noto Serif SC", serif;
        }

        button,
        input {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .app {
            position: relative;
            width: 100%;
            height: 100%;
            isolation: isolate;
            background:
                radial-gradient(circle at 50% 48%, rgba(113, 68, 31, 0.2), transparent 38%),
                #0e0906;
        }

        .stage {
            position: absolute;
            inset: 0;
            overflow: hidden;
            background: #0d0906;
            cursor: grab;
            touch-action: none;
            user-select: none;
        }

        .stage.is-dragging {
            cursor: grabbing;
        }

        .scroll-mask {
            position: absolute;
            inset: 0;
            overflow: hidden;
            clip-path: inset(0 50% 0 50%);
            filter: saturate(0.9) brightness(0.82);
            transition:
                clip-path 2.2s cubic-bezier(0.65, 0, 0.18, 1),
                filter 1.4s ease 0.7s;
        }

        body.is-started .scroll-mask {
            clip-path: inset(0 0 0 0);
            filter: saturate(1) brightness(1);
        }

        .timeline {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background-image: var(--narrative-bg);
            background-size: 100% 100%;
            background-position: left center;
            background-repeat: no-repeat;
            will-change: transform;
            transition: opacity 0.45s ease, filter 0.45s ease;
        }

        body.is-explore .timeline {
            background-image: var(--explore-bg);
        }

        .timeline::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(90deg, rgba(35, 19, 8, 0.2), transparent 2.5%, transparent 97.5%, rgba(35, 19, 8, 0.24)),
                linear-gradient(180deg, rgba(42, 22, 8, 0.12), transparent 14%, transparent 86%, rgba(42, 22, 8, 0.14));
            mix-blend-mode: multiply;
        }

        .reveal-edge {
            position: fixed;
            z-index: 28;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 12px;
            opacity: 0;
            pointer-events: none;
            border: 1px solid rgba(249, 214, 141, 0.48);
            background: linear-gradient(90deg, #4e2b13, #c59346 42%, #6a3a18 74%, #2d180c);
            box-shadow: 0 0 22px rgba(0, 0, 0, 0.75), 0 0 5px rgba(240, 191, 95, 0.42);
        }

        body.is-started .reveal-edge.left {
            animation: unfurl-left 2.2s cubic-bezier(0.65, 0, 0.18, 1) both;
        }

        body.is-started .reveal-edge.right {
            animation: unfurl-right 2.2s cubic-bezier(0.65, 0, 0.18, 1) both;
        }

        @keyframes unfurl-left {
            0% { left: calc(50% - 6px); opacity: 1; }
            84% { opacity: 1; }
            100% { left: -14px; opacity: 0; }
        }

        @keyframes unfurl-right {
            0% { left: calc(50% - 6px); opacity: 1; }
            84% { opacity: 1; }
            100% { left: calc(100% + 2px); opacity: 0; }
        }

        .cinematic-bars {
            display: none;
        }

        .cinematic-bars::before,
        .cinematic-bars::after {
            content: "";
            position: absolute;
            left: 0;
            width: 100%;
            height: max(4.5vh, env(safe-area-inset-top));
            background: linear-gradient(#080503, #0c0805);
            box-shadow: 0 2px 18px rgba(0, 0, 0, 0.42);
        }

        .cinematic-bars::before {
            top: 0;
        }

        .cinematic-bars::after {
            bottom: 0;
            transform: rotate(180deg);
        }

        .hotspot-layer {
            position: absolute;
            inset: 0;
            z-index: 4;
            opacity: 0;
            transition: opacity 0.8s ease 1.6s;
        }

        body.is-started .hotspot-layer {
            opacity: 1;
        }

        .hotspot {
            --marker-size: clamp(32px, 3.1vw, 48px);
            position: absolute;
            left: var(--x);
            top: var(--y);
            width: var(--marker-size);
            height: var(--marker-size);
            transform: translate(-50%, -50%);
            display: grid;
            place-items: center;
            padding: 0;
            color: #fff7e7;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(13px, 1.1vw, 18px);
            line-height: 1;
            border: 1px solid rgba(255, 238, 191, 0.9);
            border-radius: 50%;
            background:
                radial-gradient(circle at 35% 30%, rgba(255, 223, 137, 0.95), rgba(179, 93, 31, 0.94) 46%, rgba(85, 35, 15, 0.98) 100%);
            box-shadow:
                0 2px 8px rgba(37, 16, 5, 0.65),
                0 0 0 5px rgba(215, 156, 61, 0.18),
                0 0 20px rgba(241, 185, 74, 0.36);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        .hotspot::before {
            content: "";
            position: absolute;
            inset: -10px;
            border: 1px solid rgba(235, 181, 79, 0.45);
            border-radius: 50%;
            animation: marker-pulse 2.6s ease-out infinite;
        }

        .hotspot::after {
            content: attr(data-title);
            position: absolute;
            left: 50%;
            bottom: calc(100% + 12px);
            transform: translate(-50%, 4px);
            width: max-content;
            max-width: 220px;
            padding: 7px 11px;
            color: #fff7e8;
            font-family: "STKaiti", "KaiTi", serif;
            font-size: 15px;
            line-height: 1.2;
            letter-spacing: 0.04em;
            text-align: center;
            white-space: nowrap;
            border: 1px solid rgba(230, 180, 92, 0.55);
            border-radius: 999px;
            background: rgba(31, 17, 9, 0.9);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.36);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .hotspot:hover,
        .hotspot:focus-visible {
            z-index: 6;
            transform: translate(-50%, -50%) scale(1.12);
            filter: brightness(1.12);
            box-shadow:
                0 4px 12px rgba(37, 16, 5, 0.72),
                0 0 0 6px rgba(239, 185, 76, 0.26),
                0 0 28px rgba(255, 202, 93, 0.58);
            outline: none;
        }

        .hotspot:hover::after,
        .hotspot:focus-visible::after {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        @keyframes marker-pulse {
            0%, 30% { opacity: 0.7; transform: scale(0.82); }
            72%, 100% { opacity: 0; transform: scale(1.5); }
        }

        .narration {
            position: fixed;
            z-index: 12;
            left: clamp(12px, 3.4vw, 64px);
            top: 50%;
            width: min(39vw, 68vh, 680px);
            transform: translateY(-50%) translateX(-18px);
            opacity: 0;
            pointer-events: none;
            filter: drop-shadow(0 12px 25px rgba(53, 29, 11, 0.2));
            transition: opacity 0.6s ease, transform 0.75s cubic-bezier(0.2, 0.7, 0.2, 1);
        }

        .narration.is-right {
            right: clamp(12px, 3.4vw, 64px);
            left: auto;
            transform: translateY(-50%) translateX(18px);
        }

        .narration.is-visible {
            opacity: 1;
            transform: translateY(-50%) translateX(0);
        }

        body.is-explore .narration {
            opacity: 0;
        }

        .narration img {
            display: block;
            width: 100%;
            height: auto;
            max-height: 70vh;
            object-fit: contain;
        }

        .narration-read {
            position: absolute;
            right: 7%;
            bottom: -6px;
            min-height: 34px;
            padding: 0 13px;
            color: #fff3d5;
            font-size: 13px;
            letter-spacing: 0.08em;
            border: 1px solid rgba(225, 178, 91, 0.52);
            border-radius: 999px;
            background: rgba(37, 19, 9, 0.86);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(8px);
            cursor: pointer;
            pointer-events: none;
        }

        .narration.is-visible .narration-read {
            pointer-events: auto;
        }

        .narration-read:hover,
        .narration-read:focus-visible {
            color: #fff9e9;
            border-color: rgba(244, 201, 113, 0.86);
            background: rgba(105, 52, 21, 0.92);
            outline: none;
        }

        .hud {
            position: fixed;
            z-index: 24;
            inset: 0;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.55s ease 1.65s;
        }

        body.is-started .hud {
            opacity: 1;
        }

        .site-mark,
        .top-actions,
        .timeline-controls,
        .chapter-status {
            pointer-events: auto;
        }

        .site-mark {
            position: absolute;
            top: max(16px, calc(env(safe-area-inset-top) + 9px));
            left: max(18px, calc(env(safe-area-inset-left) + 18px));
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 246, 223, 0.92);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.72);
            letter-spacing: 0.15em;
        }

        .site-mark .seal {
            display: grid;
            place-items: center;
            width: 31px;
            height: 31px;
            color: #f5dfac;
            font-size: 18px;
            letter-spacing: 0;
            border: 1px solid rgba(245, 223, 172, 0.74);
            background: rgba(112, 35, 24, 0.86);
        }

        .site-mark strong {
            font-size: clamp(14px, 1.25vw, 19px);
            font-weight: 500;
        }

        .top-actions {
            position: absolute;
            top: max(15px, calc(env(safe-area-inset-top) + 8px));
            right: max(18px, calc(env(safe-area-inset-right) + 18px));
            display: flex;
            gap: 8px;
        }

        .hud-button {
            min-height: 38px;
            padding: 0 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            color: #fff4d8;
            font-size: 14px;
            letter-spacing: 0.05em;
            border: 1px solid rgba(225, 178, 91, 0.48);
            border-radius: 999px;
            background: rgba(27, 15, 8, 0.78);
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.22);
            backdrop-filter: blur(8px);
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }

        .hud-button:hover,
        .hud-button:focus-visible {
            background: rgba(91, 43, 18, 0.88);
            border-color: rgba(244, 201, 113, 0.82);
            outline: none;
            transform: translateY(-1px);
        }

        .hud-button:disabled {
            opacity: 0.62;
            cursor: wait;
            transform: none;
        }

        .hud-button .icon {
            min-width: 1.15em;
            font-family: Arial, sans-serif;
            font-size: 15px;
            text-align: center;
        }

        .chapter-status {
            position: absolute;
            left: 50%;
            bottom: max(88px, calc(env(safe-area-inset-bottom) + 78px));
            transform: translateX(-50%);
            width: min(78vw, 630px);
            text-align: center;
            color: #fff2d2;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
        }

        .chapter-status .eyebrow {
            display: block;
            margin-bottom: 4px;
            color: rgba(248, 208, 127, 0.88);
            font-family: Arial, sans-serif;
            font-size: 11px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
        }

        .chapter-status strong {
            display: block;
            overflow: hidden;
            font-size: clamp(16px, 1.6vw, 23px);
            font-weight: 500;
            letter-spacing: 0.08em;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .timeline-controls {
            position: absolute;
            left: 50%;
            bottom: max(20px, calc(env(safe-area-inset-bottom) + 12px));
            transform: translateX(-50%);
            width: min(86vw, 780px);
            padding: 10px 13px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(220, 168, 78, 0.38);
            border-radius: 18px;
            background: rgba(22, 12, 7, 0.76);
            box-shadow: 0 10px 38px rgba(0, 0, 0, 0.38);
            backdrop-filter: blur(10px);
        }

        .control-cluster {
            display: flex;
            gap: 7px;
        }

        .round-button {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            padding: 0;
            color: #fff2d3;
            font-family: Arial, sans-serif;
            font-size: 15px;
            border: 1px solid rgba(220, 168, 78, 0.42);
            border-radius: 50%;
            background: rgba(102, 51, 20, 0.46);
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .round-button:hover,
        .round-button:focus-visible {
            background: rgba(157, 84, 31, 0.72);
            outline: none;
            transform: scale(1.05);
        }

        .progress-wrap {
            position: relative;
            height: 30px;
            display: flex;
            align-items: center;
        }

        .progress-wrap::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 2px;
            transform: translateY(-50%);
            background: linear-gradient(90deg, rgba(216, 161, 67, 0.92) var(--progress, 0%), rgba(255, 244, 217, 0.28) var(--progress, 0%));
        }

        .timeline-range {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 30px;
            margin: 0;
            appearance: none;
            background: transparent;
            cursor: ew-resize;
        }

        .timeline-range::-webkit-slider-runnable-track {
            height: 2px;
            background: transparent;
        }

        .timeline-range::-webkit-slider-thumb {
            width: 16px;
            height: 16px;
            margin-top: -7px;
            appearance: none;
            border: 2px solid #fff1ce;
            border-radius: 50%;
            background: var(--cinnabar);
            box-shadow: 0 0 0 4px rgba(216, 161, 67, 0.2);
        }

        .timeline-range::-moz-range-track {
            height: 2px;
            background: transparent;
        }

        .timeline-range::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border: 2px solid #fff1ce;
            border-radius: 50%;
            background: var(--cinnabar);
            box-shadow: 0 0 0 4px rgba(216, 161, 67, 0.2);
        }

        .position-readout {
            min-width: 52px;
            color: rgba(255, 236, 197, 0.78);
            font-family: Georgia, serif;
            font-size: 12px;
            text-align: right;
        }

        .opening {
            position: fixed;
            inset: 0;
            z-index: 60;
            display: grid;
            place-items: center;
            padding: 28px;
            color: #f7e8c8;
            text-align: center;
            background:
                radial-gradient(circle at 50% 44%, rgba(109, 66, 32, 0.26), transparent 33%),
                linear-gradient(135deg, rgba(54, 30, 14, 0.28), transparent 45%),
                #100a06;
            transition: opacity 0.7s ease, visibility 0.7s ease;
        }

        .opening::before {
            content: "";
            position: absolute;
            inset: 18px;
            border: 1px solid rgba(201, 150, 67, 0.2);
            pointer-events: none;
        }

        .opening.is-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .opening-content {
            position: relative;
            width: min(680px, 90vw);
        }

        .opening-seal {
            width: 56px;
            height: 56px;
            margin: 0 auto 24px;
            display: grid;
            place-items: center;
            color: #f4dfb3;
            font-size: 31px;
            border: 1px solid rgba(244, 223, 179, 0.74);
            background: rgba(137, 45, 30, 0.76);
            box-shadow: 0 0 34px rgba(180, 95, 39, 0.22);
        }

        .opening-kicker {
            margin: 0 0 13px;
            color: rgba(222, 176, 96, 0.92);
            font-family: Georgia, serif;
            font-size: 12px;
            letter-spacing: 0.32em;
        }

        .opening h1 {
            margin: 0;
            font-size: clamp(38px, 7vw, 74px);
            font-weight: 400;
            line-height: 1.08;
            letter-spacing: 0.16em;
            text-shadow: 0 7px 30px rgba(0, 0, 0, 0.5);
        }

        .opening .subtitle {
            margin: 20px auto 30px;
            color: rgba(242, 220, 180, 0.76);
            font-size: clamp(15px, 1.7vw, 19px);
            line-height: 1.8;
            letter-spacing: 0.08em;
        }

        .open-scroll {
            min-width: 176px;
            min-height: 50px;
            padding: 0 26px;
            color: #fff4d8;
            font-size: 17px;
            letter-spacing: 0.12em;
            border: 1px solid rgba(238, 196, 114, 0.72);
            border-radius: 2px;
            background: linear-gradient(180deg, rgba(143, 68, 26, 0.84), rgba(96, 39, 19, 0.92));
            box-shadow: 0 11px 32px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(255, 235, 190, 0.12);
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease, opacity 0.2s ease;
        }

        .open-scroll:hover:not(:disabled),
        .open-scroll:focus-visible:not(:disabled) {
            filter: brightness(1.12);
            outline: 2px solid rgba(243, 202, 122, 0.4);
            outline-offset: 4px;
            transform: translateY(-2px);
        }

        .open-scroll:disabled {
            opacity: 0.56;
            cursor: wait;
        }

        .opening-hint {
            margin: 16px 0 0;
            color: rgba(242, 220, 180, 0.54);
            font-family: system-ui, sans-serif;
            font-size: 12px;
            letter-spacing: 0.04em;
        }

        .rotate-tip {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 80;
            place-items: center;
            padding: 32px;
            color: #f7e6c2;
            text-align: center;
            background: rgba(14, 9, 6, 0.96);
        }

        .rotate-tip strong {
            display: block;
            margin-bottom: 10px;
            font-size: 26px;
            font-weight: 400;
            letter-spacing: 0.12em;
        }

        .rotate-tip span {
            color: rgba(247, 230, 194, 0.68);
            font-family: system-ui, sans-serif;
            font-size: 14px;
        }

        .toast {
            position: fixed;
            z-index: 46;
            left: 50%;
            top: 14%;
            transform: translate(-50%, -10px);
            max-width: min(86vw, 520px);
            padding: 10px 16px;
            color: #fff0cf;
            font-size: 14px;
            letter-spacing: 0.05em;
            text-align: center;
            border: 1px solid rgba(226, 175, 87, 0.5);
            border-radius: 999px;
            background: rgba(35, 18, 9, 0.9);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.32);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .toast.is-visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .detail-dialog {
            width: auto;
            max-width: none;
            max-height: none;
            margin: auto;
            padding: 0;
            overflow: visible;
            color: var(--ink);
            border: 0;
            border-radius: clamp(8px, 1.6vw, 24px);
            background: transparent;
            box-shadow: 0 28px 90px rgba(0, 0, 0, 0.62);
        }

        .detail-dialog::backdrop {
            background: rgba(12, 8, 5, 0.78);
            backdrop-filter: blur(7px) saturate(0.7);
        }

        .chapter-dialog {
            width: min(88vw, 560px);
            max-height: 84vh;
            margin: auto;
            padding: clamp(28px, 5vw, 48px);
            overflow: auto;
            color: #3b2414;
            border: 1px solid rgba(119, 67, 28, 0.3);
            border-radius: 18px;
            background:
                linear-gradient(rgba(244, 227, 194, 0.96), rgba(235, 209, 162, 0.96)),
                #ead5aa;
            box-shadow: 0 26px 80px rgba(0, 0, 0, 0.58);
        }

        .chapter-dialog::backdrop {
            background: rgba(12, 8, 5, 0.76);
            backdrop-filter: blur(7px) saturate(0.72);
        }

        .chapter-dialog .eyebrow {
            margin: 0 0 10px;
            color: #9b3c26;
            font-family: Arial, sans-serif;
            font-size: 11px;
            letter-spacing: 0.2em;
        }

        .chapter-dialog h2 {
            margin: 0 0 18px;
            font-size: clamp(28px, 5vw, 42px);
            font-weight: 500;
        }

        .chapter-dialog p {
            margin: 0;
            font-size: clamp(17px, 2.4vw, 21px);
            line-height: 1.85;
        }

        .chapter-dialog-close {
            margin-top: 26px;
            min-height: 40px;
            padding: 0 22px;
            color: #fff4dc;
            border: 1px solid rgba(107, 49, 25, 0.35);
            border-radius: 999px;
            background: #833523;
            cursor: pointer;
        }

        .chapter-dialog-close:hover,
        .chapter-dialog-close:focus-visible {
            background: #a0442b;
            outline: none;
        }

        .detail-shell {
            position: relative;
            width: min(92vw, calc(84vh * 1.5472), 1320px);
            aspect-ratio: 1934 / 1250;
            overflow: hidden;
            border-radius: clamp(8px, 1.6vw, 24px);
            background: #ead7b4;
        }

        .detail-image,

            let scale = 1;
            let worldWidth = SOURCE_WIDTH;
            let maxScroll = 0;
            let scrollPosition = 0;
            let mode = "explore";
            let started = false;
            let activeSceneIndex = -1;
            let narrativeReady = false;
            let narrativeLoadPromise = null;
            let lastFocusedHotspot = null;
            let toastTimer = 0;
            let pointerId = null;
            let pointerStartX = 0;
            let pointerStartScroll = 0;
            let pointerTravel = 0;

            function clamp(value, min, max) {
                return Math.min(Math.max(value, min), max);
            }

            function sourcePosition() {
                return scale ? scrollPosition / scale : 0;
            }

            function nearestEvent(position) {
                return events.reduce((nearest, event) => {
                    const eventPosition = event.x * SOURCE_WIDTH / 100;
                    const nearestPosition = nearest.x * SOURCE_WIDTH / 100;
                    return Math.abs(eventPosition - position) < Math.abs(nearestPosition - position) ? event : nearest;
                }, events[0]);
            }

            function resizeTimeline() {
                const oldSourcePosition = sourcePosition();
                scale = window.innerHeight / SOURCE_HEIGHT;
                worldWidth = SOURCE_WIDTH * scale;
                timeline.style.width = `${worldWidth}px`;
                timeline.style.height = `${window.innerHeight}px`;
                maxScroll = Math.max(0, worldWidth - window.innerWidth);
                scrollPosition = clamp(oldSourcePosition * scale, 0, maxScroll);
                renderPosition();
            }

            function renderPosition() {
                timeline.style.transform = `translate3d(${-scrollPosition}px, 0, 0)`;
                const maximum = Math.max(1, maxScroll);
                const ratio = clamp(scrollPosition / maximum, 0, 1);
                const percent = Math.round(ratio * 100);
                timelineRange.value = String(Math.round(ratio * 1000));
                progressWrap.style.setProperty("--progress", `${ratio * 100}%`);
                positionReadout.value = `${percent}%`;
                positionReadout.textContent = `${percent}%`;
                updateStoryState();
            }

            function setScrollPosition(nextPosition) {
                scrollPosition = clamp(nextPosition, 0, maxScroll);
                renderPosition();
            }

            function seekToSource(nextSourcePosition) {
                setScrollPosition(nextSourcePosition * scale);
            }

            function preloadImage(source) {
                return new Promise((resolve) => {
                    const image = new Image();
                    image.onload = () => resolve({ source, loaded: true });
                    image.onerror = () => resolve({ source, loaded: false });
                    image.src = source;
                });
            }

            function preloadNarration(index) {
                if (!scenes[index]) return Promise.resolve({ loaded: false });
                if (!scenes[index].preloadPromise) {
                    scenes[index].preloadPromise = preloadImage(scenes[index].image);
                }
                return scenes[index].preloadPromise;
            }

            function sceneIndexAt(position) {
                const index = scenes.findIndex((scene) => position >= scene.start && position < scene.end);
                return index === -1 ? scenes.length - 1 : index;
            }

            function ensureNarrativeReady(index) {
                if (!narrativeLoadPromise) {
                    narrativeLoadPromise = Promise.all([
                        preloadImage(NARRATIVE_BACKGROUND),
                        preloadNarration(index)
                    ]).then((results) => {
                        narrativeReady = results.every((result) => result.loaded);
                        return narrativeReady;
                    });
                }
                return narrativeLoadPromise;
            }

            function updateStoryState() {
                const position = sourcePosition();

                if (mode === "tour") {
                    const nextIndex = sceneIndexAt(position);

                    if (nextIndex !== activeSceneIndex) {
                        activeSceneIndex = nextIndex;
                        const scene = scenes[nextIndex];
                        narration.classList.remove("is-visible");
                        window.setTimeout(() => {
                            if (mode !== "tour" || activeSceneIndex !== nextIndex) return;
                            narration.classList.toggle("is-right", scene.side === "right");
                            narrationImage.src = scene.image;
                            narrationImage.alt = `${scene.title}：${scene.summary}`;
                            narrationRead.setAttribute("aria-label", `阅读“${scene.title}”文字版`);
                            narration.classList.add("is-visible");
                        }, 170);
                        preloadNarration(nextIndex + 1);
                    }

                    modeEyebrow.textContent = "MANUAL NARRATIVE";
                    chapterLabel.textContent = scenes[activeSceneIndex]?.title || "历史长卷";
                } else {
                    const event = nearestEvent(position + window.innerWidth / Math.max(scale, 0.001) / 2);
                    narration.classList.remove("is-visible");
                    modeEyebrow.textContent = "FREE EXPLORE";
                    chapterLabel.textContent = `${event.id} · ${event.title}`;
                }
            }

                mode = nextMode;
                const isExplore = mode === "explore";
                document.body.classList.toggle("is-explore", isExplore);
                modeButton.setAttribute("aria-label", isExplore ? "进入手动章节导览" : "切换到自由探索");
                modeButtonLabel.textContent = isExplore ? "章节导览" : "自由探索";
                modeButton.querySelector(".icon").textContent = isExplore ? "卷" : "览";
                activeSceneIndex = -1;
                updateStoryState();

                if (options.announce) {
                    showToast(isExplore ? "自由探索：拖动浏览，点击光点查看详情" : "手动章节导览：拖动画卷，文案将随历史位置切换");
                }
            }

            async function enterTour() {
                const index = sceneIndexAt(sourcePosition());
                modeButton.disabled = true;
                modeButtonLabel.textContent = "导览加载中";
                const loaded = narrativeReady || await ensureNarrativeReady(index);
                modeButton.disabled = false;

                if (!loaded) {
                    narrativeLoadPromise = null;
                    modeButtonLabel.textContent = "章节导览";
                    showToast("导览素材暂未加载成功，请稍后重试");
                    return;
                }

                setMode("tour", { announce: true });
            }

            function showToast(message) {
                window.clearTimeout(toastTimer);
                toast.textContent = message;
                toast.classList.add("is-visible");
                toastTimer = window.setTimeout(() => toast.classList.remove("is-visible"), 3800);
            }

            function openChapterReading() {
                const scene = scenes[activeSceneIndex] || scenes[sceneIndexAt(sourcePosition())];
                chapterDialogTitle.textContent = scene.title;
                chapterDialogSummary.textContent = scene.summary;
                chapterDialog.showModal();
                chapterDialogClose.focus({ preventScroll: true });
            }

            function closeChapterReading() {
                if (chapterDialog.open) chapterDialog.close();
            }

            function updateMusicButton() {
                const isPlaying = !audio.paused;
                musicIcon.textContent = isPlaying ? "♫" : "♪";
                musicLabel.textContent = isPlaying ? "音乐开启" : "音乐暂停";
                musicButton.setAttribute("aria-label", isPlaying ? "暂停背景音乐" : "播放背景音乐");
                musicButton.setAttribute("aria-pressed", String(isPlaying));
            }

            async function startMusic() {
                audio.volume = 0.5;
                try {
                    await audio.play();
                } catch (error) {
                    showToast("浏览器暂未播放音乐，可点击右上角音乐按钮开启");
                }
                updateMusicButton();
            }

            async function toggleMusic() {
                if (audio.paused) {
                    await startMusic();
                } else {
                    audio.pause();
                    updateMusicButton();
                }
            }

            function openDetail(event, hotspot) {
                if (pointerTravel > 8) return;
                lastFocusedHotspot = hotspot;
                detailHeading.textContent = event.title;
                detailShell.classList.toggle("is-composite", Boolean(event.background && event.text));

                if (event.background && event.text) {
                    detailBackground.src = event.background;
                    detailBackground.alt = `${event.title}详情背景`;
                    detailText.src = event.text;
                    detailText.alt = `${event.title}完整文字介绍`;
                    detailTextScroll.scrollTop = 0;
                    detailImage.removeAttribute("src");
                    detailImage.alt = "";
                } else {
                    detailImage.src = event.image;
                    detailImage.alt = `${event.title}历史介绍`;
                    detailBackground.removeAttribute("src");
                    detailText.removeAttribute("src");
                }

                detailDialog.showModal();
                detailClose.focus({ preventScroll: true });
            }

            function closeDetail() {
                if (!detailDialog.open) return;
                detailDialog.close();
            }

            function buildHotspots() {
                const fragment = document.createDocumentFragment();
                events.forEach((event) => {
                    const button = document.createElement("button");
                    button.type = "button";
                    button.className = "hotspot";
                    button.textContent = event.id;
                    button.dataset.title = event.title;
                    button.style.setProperty("--x", `${event.x}%`);
                    button.style.setProperty("--y", `${event.y}%`);
                    button.setAttribute("aria-label", `${event.id}，${event.title}，打开详情`);
                    button.addEventListener("click", () => openDetail(event, button));
                    fragment.appendChild(button);
                });
                hotspotLayer.appendChild(fragment);
            }

            function handlePointerDown(event) {
                if (!started || detailDialog.open || chapterDialog.open || event.button !== 0 || event.target.closest("button, input")) return;
                pointerId = event.pointerId;
                pointerStartX = event.clientX;
                pointerStartScroll = scrollPosition;
                pointerTravel = 0;
                stage.classList.add("is-dragging");
                stage.setPointerCapture(pointerId);
            }

            function handlePointerMove(event) {
                if (event.pointerId !== pointerId) return;
                const delta = pointerStartX - event.clientX;
                pointerTravel = Math.max(pointerTravel, Math.abs(delta));
                setScrollPosition(pointerStartScroll + delta);
            }

            function handlePointerUp(event) {
                if (event.pointerId !== pointerId) return;
                if (stage.hasPointerCapture(pointerId)) stage.releasePointerCapture(pointerId);
                pointerId = null;
                stage.classList.remove("is-dragging");
                window.setTimeout(() => { pointerTravel = 0; }, 0);
            }

            function startExperience() {
                if (started) return;
                started = true;
                document.body.classList.add("is-started");
                opening.classList.add("is-hidden");
                startMusic();

                window.setTimeout(() => {
                    setMode("explore", { announce: false });
                    showToast("自由探索：左右拖动、滚轮或方向键浏览，点击光点查看详情");
                }, 2250);
            }

            async function prepareExperience() {
                resizeTimeline();
                buildHotspots();

                const criticalLoad = Promise.all([
                    preloadImage(EXPLORE_BACKGROUND)
                ]);
                const safetyTimeout = new Promise((resolve) => window.setTimeout(resolve, 12000));
                await Promise.race([criticalLoad, safetyTimeout]);
                openScrollButton.disabled = false;
                openScrollButton.textContent = "启卷探索";
            }

            openScrollButton.addEventListener("click", startExperience);

            restartButton.addEventListener("click", () => {
                seekToSource(0);
                showToast("已回到时间轴起点");
            });

            modeButton.addEventListener("click", () => {
                if (mode === "tour") {
                    setMode("explore", { announce: true });
                } else {
                    enterTour();
                }
            });

            narrationRead.addEventListener("click", openChapterReading);
            chapterDialogClose.addEventListener("click", closeChapterReading);
            chapterDialog.addEventListener("click", (event) => {
                if (event.target === chapterDialog) closeChapterReading();
            });

            musicButton.addEventListener("click", toggleMusic);
            audio.addEventListener("play", updateMusicButton);
            audio.addEventListener("pause", updateMusicButton);

            timelineRange.addEventListener("input", () => {
                const ratio = Number(timelineRange.value) / 1000;
                setScrollPosition(maxScroll * ratio);
            });

            stage.addEventListener("pointerdown", handlePointerDown);
            stage.addEventListener("pointermove", handlePointerMove);
            stage.addEventListener("pointerup", handlePointerUp);
            stage.addEventListener("pointercancel", handlePointerUp);

            stage.addEventListener("wheel", (event) => {
                if (!started || detailDialog.open || chapterDialog.open) return;
                event.preventDefault();
                const delta = Math.abs(event.deltaX) > Math.abs(event.deltaY) ? event.deltaX : event.deltaY;
                setScrollPosition(scrollPosition + delta * 1.2);
            }, { passive: false });

            window.addEventListener("keydown", (event) => {
                if (!started || detailDialog.open || chapterDialog.open || event.target.matches("input, button")) return;
                const step = event.shiftKey ? window.innerWidth * 0.75 : 120;
                if (["ArrowLeft", "ArrowRight", "PageUp", "PageDown", "Home", "End"].includes(event.key)) {
                    event.preventDefault();
                }

                if (event.key === "ArrowLeft" || event.key === "PageUp") {
                    setScrollPosition(scrollPosition - step);
                } else if (event.key === "ArrowRight" || event.key === "PageDown") {
                    setScrollPosition(scrollPosition + step);
                } else if (event.key === "Home") {
                    setScrollPosition(0);
                } else if (event.key === "End") {
                    setScrollPosition(maxScroll);
                }
            });

            detailClose.addEventListener("click", closeDetail);
            detailDialog.addEventListener("click", (event) => {
                if (event.target === detailDialog) closeDetail();
            });
            detailDialog.addEventListener("close", () => {
                if (lastFocusedHotspot) lastFocusedHotspot.focus({ preventScroll: true });
            });

            window.addEventListener("resize", resizeTimeline, { passive: true });
            window.addEventListener("orientationchange", resizeTimeline, { passive: true });

            prepareExperience();
        })();
    </script>
</body>
</html>
